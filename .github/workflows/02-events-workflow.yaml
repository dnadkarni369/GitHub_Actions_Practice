name: different workflow event
on:
    push:
    pull_request:
    schedule:
        - cron: '0/5 0 * * *'
    workflow_dispatch:
jobs:
    event_job:
        runs-on: ubuntu-latest
        steps:
            - name: print runner environment
              shell: bash
              run: | 
               printenv
               echo "$RUNNER_OS"
